name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Alle fuenf Qualitaets-Stufen (Lint, Typecheck, Unit, Build, E2E) muessen
  # gruen sein, bevor ueberhaupt exportiert/deployt wird - siehe quality.yml.
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      # Demo-PIN kommt aus der Repository-Variablen DEMO_PIN (Settings ->
      # Secrets and variables -> Actions -> Variables). Rotation also ohne
      # Code-Aenderung. Ist nichts gesetzt, greift der Fallback aus
      # lib/auth/pin.ts (DEMO_PIN_FALLBACK). Kein Secret: der Wert landet
      # ohnehin im Client-Bundle - siehe O4/lib/auth/pin.ts.
      NEXT_PUBLIC_DEMO_PIN: ${{ vars.DEMO_PIN }}
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
